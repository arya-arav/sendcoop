# Production (D82): one server running everything, behind Caddy (HTTPS).
# See docs/deploy.md. Secrets come from .env.production next to this file.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm migrate
name: sendcoop

x-app: &app
  image: sendcoop:latest
  build: .
  restart: unless-stopped
  env_file: .env.production
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://sendcoop:${POSTGRES_PASSWORD}@postgres:5432/sendcoop
    REDIS_URL: redis://redis:6379
    STORAGE_DIR: /data/storage
  volumes:
    - storage:/data/storage
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  web:
    <<: *app
    command: ["pnpm", "--filter", "@sendcoop/web", "start"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/api/health"]
      interval: 30s

  edge:
    <<: *app
    command: ["pnpm", "--filter", "@sendcoop/edge", "start"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3001/health"]
      interval: 30s

  # Sending is CPU-bound: one worker sends ~290 emails a second (D80). Raise
  # the replicas (up to the server's cores) to send faster.
  worker:
    <<: *app
    command: ["pnpm", "--filter", "@sendcoop/worker", "start"]
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3002/health"]
      interval: 30s

  # Applies database migrations: run before starting a new version.
  migrate:
    <<: *app
    restart: "no"
    command: ["pnpm", "db:migrate"]
    profiles: ["tools"]

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sendcoop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sendcoop
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sendcoop -d sendcoop"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # BullMQ needs noeviction: queued jobs must never be dropped.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Daily database backups, copied off the server; a restore test on Sundays (D81).
  backup:
    build: ops/backup
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://sendcoop:${POSTGRES_PASSWORD}@postgres:5432/sendcoop
      BACKUP_DIR: /backups
      BACKUP_S3_URI: ${BACKUP_S3_URI:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_AWS_REGION:-us-east-1}
    volumes:
      - backups:/backups
    depends_on:
      postgres: { condition: service_healthy }

  # HTTPS for the app and tracking domains (certificates from Let's Encrypt).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      TRACKING_DOMAIN: ${TRACKING_DOMAIN}
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [web, edge]

volumes:
  postgres:
  redis:
  storage:
  backups:
  caddy:
