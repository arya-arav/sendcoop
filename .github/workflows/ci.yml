name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI-only values. The auth secret here protects nothing real.
env:
  DATABASE_URL: postgres://sendcoop:sendcoop@localhost:5432/sendcoop
  REDIS_URL: redis://localhost:6379
  SMTP_HOST: localhost
  SMTP_PORT: "1025"
  SMTP_SECURE: "false"
  MAIL_FROM: "Sendcoop <no-reply@sendcoop.test>"
  MAILPIT_URL: http://localhost:8025
  BETTER_AUTH_SECRET: ci-only-secret-do-not-use-anywhere-else
  BETTER_AUTH_URL: http://localhost:3000
  ENCRYPTION_KEY: Y2ktb25seS1rZXktZG8tbm90LXVzZS1hbnl3aGVyZSE=
  SPF_INCLUDE: amazonses.com
  ALLOW_PRIVATE_SMTP_HOSTS: "true"
  SNS_TEST_CERT_URL: http://localhost:3998/sns-test-cert.pem
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Format, lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Integration and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Official Playwright image: Chromium and its system packages are preinstalled,
    # so the job never depends on apt mirrors. Keep the tag in step with
    # @playwright/test in apps/web/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    # Inside a job container, services are reached by name, not localhost.
    env:
      DATABASE_URL: postgres://sendcoop:sendcoop@postgres:5432/sendcoop
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      MAILPIT_URL: http://mailpit:8025
      S3_ENDPOINT: http://s3:9000
      S3_REGION: us-east-1
      S3_BUCKET: sendcoop-media
      S3_ACCESS_KEY_ID: sendcoop
      S3_SECRET_ACCESS_KEY: ci-only-s3-secret
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_URL: http://s3:9000/sendcoop-media
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sendcoop
          POSTGRES_PASSWORD: sendcoop
          POSTGRES_DB: sendcoop
        options: >-
          --health-cmd "pg_isready -U sendcoop -d sendcoop"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        env:
          MP_MAX_MESSAGES: 50000
      # S3-compatible storage for uploaded images (RustFS runs without arguments).
      s3:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: sendcoop
          RUSTFS_SECRET_KEY: ci-only-s3-secret
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - name: Create the media bucket (waits for the S3 service to start)
        run: for i in $(seq 1 30); do pnpm media:setup && exit 0; sleep 2; done; exit 1
      - run: pnpm test:integration
      - run: pnpm turbo run build --filter=@sendcoop/web --filter=@sendcoop/worker
      - run: pnpm test:e2e
        env:
          AUTH_RATE_LIMIT: disabled
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
