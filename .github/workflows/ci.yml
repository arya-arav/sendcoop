name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI-only values. The auth secret here protects nothing real.
env:
  DATABASE_URL: postgres://sendcoop:sendcoop@localhost:5432/sendcoop
  REDIS_URL: redis://localhost:6379
  SMTP_HOST: localhost
  SMTP_PORT: "1025"
  SMTP_SECURE: "false"
  MAIL_FROM: "Sendcoop <no-reply@sendcoop.test>"
  MAILPIT_URL: http://localhost:8025
  BETTER_AUTH_SECRET: ci-only-secret-do-not-use-anywhere-else
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Format, lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Integration and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sendcoop
          POSTGRES_PASSWORD: sendcoop
          POSTGRES_DB: sendcoop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sendcoop -d sendcoop"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @sendcoop/web exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm --filter @sendcoop/web build
      - run: pnpm test:e2e
        env:
          AUTH_RATE_LIMIT: disabled
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
