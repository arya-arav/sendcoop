packages:
  - apps/*
  - packages/*

# pnpm 10 blocks dependency install scripts unless listed here
onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - sharp
  - unrs-resolver

# Next.js lint plugins still declare eslint <=9 as a peer but work on 10
# (verified with react, jsx-a11y and @next/next rules firing).
peerDependencyRules:
  allowedVersions:
    eslint: "10"
